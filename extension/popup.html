<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>Ouija</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 30% 20%, oklch(0.18 calc(0.24*0.50) 35 / 0.95) 0%, oklch(0.08 calc(0.24*0.28) 35 / 0.98) 100%);
      color: oklch(0.78 calc(0.24*0.55) 35);
      padding: 20px;
      border-radius: 16px;
      border-top: 1px solid oklch(0.88 calc(0.24*0.90) 35 / 0.10);
      box-shadow:
        0 0 0 1px oklch(0.66 calc(0.24*0.78) 35 / 0.12),
        0 8px 32px oklch(0.10 calc(0.24*0.40) 35 / 0.60),
        0 2px 8px oklch(0.10 calc(0.24*0.40) 35 / 0.40);
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
      color: oklch(0.97 calc(0.24*0.10) 35);
    }

    .logo {
      font-style: normal;
      color: oklch(0.84 calc(0.24*0.92) 35);
      font-size: 14px;
      background: oklch(0.22 calc(0.24*0.52) 35 / 0.30);
      border: 1px solid oklch(0.66 calc(0.24*0.78) 35 / 0.48);
      border-radius: 4px;
      padding: 1px 4px;
      margin-right: 2px;
    }

    .subtitle {
      font-size: 11px;
      color: oklch(0.44 calc(0.24*0.38) 35);
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: oklch(0.44 calc(0.24*0.38) 35);
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid oklch(0.50 calc(0.24*0.55) 35 / 0.20);
      background: oklch(0.12 calc(0.24*0.30) 35 / 0.50);
      color: oklch(0.97 calc(0.24*0.10) 35);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      margin-bottom: 8px;
      transition: border-color 150ms;
    }

    input:focus, select:focus {
      border-color: oklch(0.70 calc(0.24*0.72) 35 / 0.50);
    }

    input::placeholder {
      color: oklch(0.44 calc(0.24*0.38) 35);
    }

    button {
      width: 100%;
      padding: 9px;
      border-radius: 999px;
      border: 1px solid oklch(0.70 calc(0.24*0.72) 35 / 0.50);
      background: oklch(0.20 calc(0.24*0.55) 35 / 0.14);
      color: oklch(0.86 calc(0.24*0.90) 35);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 150ms;
    }

    button:hover {
      background: oklch(0.26 calc(0.24*0.60) 35 / 0.24);
      border-color: oklch(0.76 calc(0.24*0.78) 35 / 0.60);
    }

    button:active {
      transform: scale(0.96);
    }

    .divider {
      text-align: center;
      font-size: 10px;
      color: oklch(0.44 calc(0.24*0.38) 35);
      margin: 12px 0;
    }

    .status {
      font-size: 11px;
      margin-top: 10px;
      color: oklch(0.60 calc(0.24*0.45) 35);
    }

    .connected { color: oklch(0.76 0.20 162); }
    .error { color: oklch(0.72 0.22 22); }

    #cold-section { display: none; }
    #cold-section.show { display: block; }
    .cold-input { font-size: 12px; }
    .cold-btn { font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1><span class="logo">✦</span> Ouija</h1>
  <p class="subtitle">Cross-site onboarding guidance</p>

  <div id="key-section">
    <p class="section-label">Company API key</p>
    <input type="text" id="key" placeholder="Paste your API key" autocomplete="off" />
    <button id="connect">Connect</button>
  </div>

  <div class="divider">— or —</div>

  <div id="cold-section" class="show">
    <p class="section-label">Not on a configured list?</p>
    <input type="text" id="cold-query" class="cold-input" placeholder="What do you want to set up? e.g. &quot;Connect Stripe webhooks&quot;" autocomplete="off" />
    <button id="cold-start" class="cold-btn">Figure it out for me →</button>
  </div>

  <div id="status" class="status"></div>
  <script src="dist/popup.js"></script>
</body>
</html>
