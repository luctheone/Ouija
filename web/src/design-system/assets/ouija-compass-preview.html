<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouija — Compass Mark</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --ouija-h: 35; --ouija-c: 0.18; }

    body {
      background: oklch(0.065 calc(var(--ouija-c) * 0.06) var(--ouija-h));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
    }

    .page {
      width: min(860px, 100vw);
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: oklch(0.17 0 0);
    }

    /* ── Rotating glint border ───────────────────────────────── */
    @property --g-angle { syntax: '<angle>'; inherits: false; initial-value: 45deg; }
    @keyframes glint { to { --g-angle: 405deg; } }

    .glint {
      position: relative;
      isolation: isolate;
    }
    .glint::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from var(--g-angle),
        var(--ouija-glint-lo)  0deg,
        var(--ouija-glint-lo)  66deg,
        var(--ouija-glint-mid) 75deg,
        var(--ouija-glint-hi)  84deg,
        var(--ouija-glint-mid) 93deg,
        var(--ouija-glint-lo)  102deg,
        var(--ouija-glint-lo)  360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: glint 9s ease-in-out infinite;
      pointer-events: none;
      z-index: 3;
    }

    /* ── Hero ────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(180deg, var(--ouija-surface-strong), var(--ouija-surface));
      -webkit-backdrop-filter: var(--ouija-blur-panel);
      backdrop-filter: var(--ouija-blur-panel);
      padding: 72px 60px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      color: var(--ouija-mark-color);
    }
    .hero-lockup {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .hero-wordmark {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 54px;
      line-height: var(--lh-tight);
      color: var(--ouija-text-hi);
      letter-spacing: -0.01em;
    }
    .hero-eyebrow {
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ouija-text-muted);
      white-space: nowrap;
    }

    /* ── In-context panel simulations ───────────────────────── */
    .in-context {
      padding: 28px 32px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      background: oklch(0.10 calc(var(--ouija-c) * 0.12) var(--ouija-h));
    }

    .panel-sim {
      border-radius: var(--ouija-radius-panel);
      box-shadow: var(--ouija-shadow-panel);
      overflow: hidden;
    }
    .panel-head {
      background: linear-gradient(180deg, var(--ouija-surface-strong), var(--ouija-surface));
      -webkit-backdrop-filter: var(--ouija-blur-panel);
      backdrop-filter: var(--ouija-blur-panel);
      padding: 16px 14px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mark-ring {
      flex: 0 0 auto;
      width: 34px; height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ouija-mark-bg);
      border: 1px solid var(--ouija-mark-border);
      color: var(--ouija-mark-color);
    }
    .panel-id { flex: 1; min-width: 0; }
    .panel-name {
      display: block;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: var(--fs-identity);
      line-height: var(--lh-tight);
      color: var(--ouija-text-hi);
      letter-spacing: 0.01em;
    }
    .panel-sub {
      display: block;
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      color: var(--ouija-text-muted);
      letter-spacing: var(--ls-wide);
      margin-top: 1px;
    }
    .panel-body {
      background: var(--ouija-surface);
      padding: 10px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .panel-line {
      height: 7px;
      border-radius: 99px;
      background: var(--ouija-surface-soft);
    }
    .panel-line--short { width: 55%; }
    .panel-line--med   { width: 80%; }
    .panel-line--full  { width: 100%; }

    /* ── Color context swatches ──────────────────────────────── */
    .swatches {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
    }
    .swatch {
      padding: 40px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      background: var(--ouija-surface);
      -webkit-backdrop-filter: var(--ouija-blur-panel);
      backdrop-filter: var(--ouija-blur-panel);
    }
    .swatch-mark { color: var(--ouija-mark-color); }
    .swatch-label {
      font-size: 8px;
      font-weight: var(--fw-semibold);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ouija-text-muted);
    }

    /* ── Orb lockup ──────────────────────────────────────────── */
    .orb-row {
      background: oklch(0.10 calc(var(--ouija-c) * 0.10) var(--ouija-h));
      padding: 32px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .orb {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 50px;
      padding: 0 16px 0 6px;
      border-radius: 999px;
      background: var(--ouija-surface-strong);
      -webkit-backdrop-filter: var(--ouija-blur-orb);
      backdrop-filter: var(--ouija-blur-orb);
      box-shadow: var(--ouija-shadow-panel);
    }
    .orb-mark {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: grid; place-items: center;
      color: var(--ouija-mark-color);
      background: var(--ouija-mark-bg);
      border: 1px solid var(--ouija-mark-border);
    }
    .orb-label {
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      color: var(--ouija-text-lo);
      letter-spacing: var(--ls-wide);
      white-space: nowrap;
    }

    /* ── Size scale ──────────────────────────────────────────── */
    .scale {
      background: linear-gradient(180deg, var(--ouija-surface-strong), var(--ouija-surface));
      padding: 44px 60px 48px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 28px;
      color: var(--ouija-mark-color);
    }
    .scale-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .scale-n {
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.10em;
      color: var(--ouija-text-muted);
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-reduced-motion: reduce) {
      .glint::after { animation: none; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- ── 1. Hero ─────────────────────────────────────────── -->
  <div class="hero">
    <div class="hero-lockup">
      <span data-compass="72"></span>
      <span class="hero-wordmark">Ouija</span>
    </div>
    <span class="hero-eyebrow">Compass Mark</span>
  </div>

  <!-- ── 2. In context — 3 host hues ────────────────────── -->
  <div class="in-context">

    <!-- Amber (default) -->
    <div class="panel-sim glint" style="--ouija-h:35; --ouija-c:0.18;">
      <div class="panel-head">
        <div class="mark-ring"><span data-compass="16"></span></div>
        <div class="panel-id">
          <span class="panel-name">Ouija</span>
          <span class="panel-sub">3 of 6</span>
        </div>
      </div>
      <div class="panel-body">
        <div class="panel-line panel-line--full"></div>
        <div class="panel-line panel-line--med"></div>
        <div class="panel-line panel-line--short"></div>
      </div>
    </div>

    <!-- Blue -->
    <div class="panel-sim glint" style="--ouija-h:250; --ouija-c:0.14;">
      <div class="panel-head">
        <div class="mark-ring"><span data-compass="16"></span></div>
        <div class="panel-id">
          <span class="panel-name">Ouija</span>
          <span class="panel-sub">2 of 5</span>
        </div>
      </div>
      <div class="panel-body">
        <div class="panel-line panel-line--full"></div>
        <div class="panel-line panel-line--med"></div>
        <div class="panel-line panel-line--short"></div>
      </div>
    </div>

    <!-- Teal -->
    <div class="panel-sim glint" style="--ouija-h:175; --ouija-c:0.13;">
      <div class="panel-head">
        <div class="mark-ring"><span data-compass="16"></span></div>
        <div class="panel-id">
          <span class="panel-name">Ouija</span>
          <span class="panel-sub">1 of 4</span>
        </div>
      </div>
      <div class="panel-body">
        <div class="panel-line panel-line--full"></div>
        <div class="panel-line panel-line--med"></div>
        <div class="panel-line panel-line--short"></div>
      </div>
    </div>

  </div>

  <!-- ── 3. Mark isolated across color contexts ──────────── -->
  <div class="swatches">
    <div class="swatch" style="--ouija-h:35;  --ouija-c:0.18;">
      <span class="swatch-mark" data-compass="40"></span>
      <span class="swatch-label">Amber</span>
    </div>
    <div class="swatch" style="--ouija-h:250; --ouija-c:0.14;">
      <span class="swatch-mark" data-compass="40"></span>
      <span class="swatch-label">Blue</span>
    </div>
    <div class="swatch" style="--ouija-h:310; --ouija-c:0.11;">
      <span class="swatch-mark" data-compass="40"></span>
      <span class="swatch-label">Violet</span>
    </div>
    <div class="swatch ouija-light" style="--ouija-h:35; --ouija-c:0.16;">
      <span class="swatch-mark" data-compass="40"></span>
      <span class="swatch-label">Light</span>
    </div>
  </div>

  <!-- ── 4. Collapsed orb form ───────────────────────────── -->
  <div class="orb-row">
    <div class="orb glint">
      <div class="orb-mark"><span data-compass="18"></span></div>
      <span class="orb-label">2 of 6</span>
    </div>
    <div class="orb glint" style="--ouija-h:250; --ouija-c:0.14;">
      <div class="orb-mark"><span data-compass="18"></span></div>
      <span class="orb-label">Step 4</span>
    </div>
    <div class="orb glint" style="--ouija-h:175; --ouija-c:0.13;">
      <div class="orb-mark"><span data-compass="18"></span></div>
      <span class="orb-label">5 of 7</span>
    </div>
  </div>

  <!-- ── 5. Size scale ───────────────────────────────────── -->
  <div class="scale">
    <div class="scale-unit"><span data-compass="16"></span><span class="scale-n">16</span></div>
    <div class="scale-unit"><span data-compass="20"></span><span class="scale-n">20</span></div>
    <div class="scale-unit"><span data-compass="24"></span><span class="scale-n">24</span></div>
    <div class="scale-unit"><span data-compass="32"></span><span class="scale-n">32</span></div>
    <div class="scale-unit"><span data-compass="40"></span><span class="scale-n">40</span></div>
    <div class="scale-unit"><span data-compass="48"></span><span class="scale-n">48</span></div>
    <div class="scale-unit"><span data-compass="64"></span><span class="scale-n">64</span></div>
    <div class="scale-unit"><span data-compass="80"></span><span class="scale-n">80</span></div>
    <div class="scale-unit"><span data-compass="96"></span><span class="scale-n">96</span></div>
  </div>

</div>

<script>
  // Compass SVG — pure currentColor, color-scheme agnostic
  function compassSVG(size) {
    const s = Number(size);
    return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" fill="none"
      xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
      style="display:block;flex-shrink:0">
      <!-- outer ring -->
      <circle cx="50" cy="50" r="43" stroke="currentColor" stroke-width="1.5"/>
      <!-- intercardinal ticks at 45° -->
      <line x1="80.4" y1="19.6" x2="75.6" y2="24.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
      <line x1="80.4" y1="80.4" x2="75.6" y2="75.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
      <line x1="19.6" y1="80.4" x2="24.4" y2="75.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
      <line x1="19.6" y1="19.6" x2="24.4" y2="24.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
      <!-- N needle — solid (dominant) -->
      <path d="M50,12 L56,36 L50,50 L44,36 Z" fill="currentColor"/>
      <!-- S needle — hollow (counterpoint) -->
      <path d="M50,88 L44,64 L50,50 L56,64 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- E needle — solid, receded -->
      <path d="M88,50 L64,44 L50,50 L64,56 Z" fill="currentColor" opacity="0.68"/>
      <!-- W needle — hollow, receded -->
      <path d="M12,50 L36,44 L50,50 L36,56 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.52"/>
      <!-- center pivot -->
      <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
    </svg>`;
  }

  document.querySelectorAll('[data-compass]').forEach(el => {
    el.innerHTML = compassSVG(el.dataset.compass);
  });
</script>
</body>
</html>
