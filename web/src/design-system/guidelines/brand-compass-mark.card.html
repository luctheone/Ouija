<!-- @dsCard group="Brand" viewport="700x200" name="Compass Mark" subtitle="Geometric compass rose; pure currentColor — adapts to any host hue via --ouija-mark-color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  :root { --ouija-h: 35; --ouija-c: 0.18; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: oklch(0.065 calc(var(--ouija-c) * 0.06) var(--ouija-h));
    color: var(--ouija-text-hi);
  }

  .wrap {
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  /* Hero lockup */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
  }
  .hero-lockup {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--ouija-mark-color);
  }
  .hero-wordmark {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 32px;
    line-height: 1.1;
    color: var(--ouija-text-hi);
    letter-spacing: -0.01em;
  }
  .cap {
    font-size: 9px;
    font-family: var(--font-mono);
    font-weight: 500;
    color: var(--ouija-text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Divider */
  .rule { width: 1px; height: 80px; background: oklch(0.28 0 0); flex: 0 0 auto; }

  /* Context swatches */
  .contexts {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
  }
  .ctx {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .mark-ring {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--ouija-mark-bg);
    border: 1px solid var(--ouija-mark-border);
    color: var(--ouija-mark-color);
  }
  .ctx-label {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ouija-text-muted);
  }

  /* Light swatch override */
  .ctx-light {
    background: oklch(0.93 0.008 35);
    border-radius: 8px;
    padding: 8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Hero lockup -->
  <div class="hero">
    <div class="hero-lockup">
      <svg width="44" height="44" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <circle cx="50" cy="50" r="43" stroke="currentColor" stroke-width="1.5"/>
        <line x1="80.4" y1="19.6" x2="75.6" y2="24.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
        <line x1="80.4" y1="80.4" x2="75.6" y2="75.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
        <line x1="19.6" y1="80.4" x2="24.4" y2="75.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
        <line x1="19.6" y1="19.6" x2="24.4" y2="24.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
        <path d="M50,12 L56,36 L50,50 L44,36 Z" fill="currentColor"/>
        <path d="M50,88 L44,64 L50,50 L56,64 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M88,50 L64,44 L50,50 L64,56 Z" fill="currentColor" opacity="0.68"/>
        <path d="M12,50 L36,44 L50,50 L36,56 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.52"/>
        <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
      </svg>
      <span class="hero-wordmark">Ouija</span>
    </div>
    <span class="cap">ouija-compass-mark.svg</span>
  </div>

  <div class="rule"></div>

  <!-- Color context swatches -->
  <div class="contexts">

    <div class="ctx" style="--ouija-h:35; --ouija-c:0.18;">
      <div class="mark-ring">
        <svg width="22" height="22" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <circle cx="50" cy="50" r="43" stroke="currentColor" stroke-width="1.5"/>
          <path d="M50,12 L56,36 L50,50 L44,36 Z" fill="currentColor"/>
          <path d="M50,88 L44,64 L50,50 L56,64 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M88,50 L64,44 L50,50 L64,56 Z" fill="currentColor" opacity="0.68"/>
          <path d="M12,50 L36,44 L50,50 L36,56 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.52"/>
          <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
        </svg>
      </div>
      <span class="ctx-label">Amber</span>
    </div>

    <div class="ctx" style="--ouija-h:250; --ouija-c:0.14;">
      <div class="mark-ring">
        <svg width="22" height="22" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <circle cx="50" cy="50" r="43" stroke="currentColor" stroke-width="1.5"/>
          <path d="M50,12 L56,36 L50,50 L44,36 Z" fill="currentColor"/>
          <path d="M50,88 L44,64 L50,50 L56,64 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M88,50 L64,44 L50,50 L64,56 Z" fill="currentColor" opacity="0.68"/>
          <path d="M12,50 L36,44 L50,50 L36,56 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.52"/>
          <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
        </svg>
      </div>
      <span class="ctx-label">Blue</span>
    </div>

    <div class="ctx" style="--ouija-h:175; --ouija-c:0.13;">
      <div class="mark-ring">
        <svg width="22" height="22" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <circle cx="50" cy="50" r="43" stroke="currentColor" stroke-width="1.5"/>
          <path d="M50,12 L56,36 L50,50 L44,36 Z" fill="currentColor"/>
          <path d="M50,88 L44,64 L50,50 L56,64 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M88,50 L64,44 L50,50 L64,56 Z" fill="currentColor" opacity="0.68"/>
          <path d="M12,50 L36,44 L50,50 L36,56 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.52"/>
          <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
        </svg>
      </div>
      <span class="ctx-label">Teal</span>
    </div>

    <div class="ctx" style="--ouija-h:310; --ouija-c:0.11;">
      <div class="mark-ring">
        <svg width="22" height="22" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <circle cx="50" cy="50" r="43" stroke="currentColor" stroke-width="1.5"/>
          <path d="M50,12 L56,36 L50,50 L44,36 Z" fill="currentColor"/>
          <path d="M50,88 L44,64 L50,50 L56,64 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M88,50 L64,44 L50,50 L64,56 Z" fill="currentColor" opacity="0.68"/>
          <path d="M12,50 L36,44 L50,50 L36,56 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.52"/>
          <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
        </svg>
      </div>
      <span class="ctx-label">Violet</span>
    </div>

    <div class="ctx ctx-light ouija-light" style="--ouija-h:35; --ouija-c:0.16;">
      <div class="mark-ring">
        <svg width="22" height="22" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <circle cx="50" cy="50" r="43" stroke="currentColor" stroke-width="1.5"/>
          <path d="M50,12 L56,36 L50,50 L44,36 Z" fill="currentColor"/>
          <path d="M50,88 L44,64 L50,50 L56,64 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M88,50 L64,44 L50,50 L64,56 Z" fill="currentColor" opacity="0.68"/>
          <path d="M12,50 L36,44 L50,50 L36,56 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.52"/>
          <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
        </svg>
      </div>
      <span class="ctx-label" style="color:oklch(0.45 0.04 35)">Light</span>
    </div>

  </div>
</div>
</body>
</html>
