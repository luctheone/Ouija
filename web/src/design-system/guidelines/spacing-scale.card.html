<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4pt grid — generous whitespace, nothing busy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); }
  .wrap { padding: 26px 28px; display: flex; align-items: flex-end; gap: 18px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--accent-200); border-radius: var(--radius-xs); width: 100%; }
  .box { display: flex; align-items: flex-end; height: 64px; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); }
  .val { font-size: 11px; font-weight: var(--fw-bold); color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="wrap" id="wrap"></div>
  <script>
    const steps = [['1','4'],['2','8'],['3','12'],['4','16'],['5','20'],['6','24'],['8','32'],['10','40'],['12','48']];
    document.getElementById('wrap').innerHTML = steps.map(([t,px]) =>
      `<div class="col" style="width:${px}px">
         <span class="val">${px}</span>
         <div class="box"><div class="bar" style="height:${px}px"></div></div>
         <span class="tok">--space-${t}</span>
       </div>`).join('');
  </script>
</body>
</html>
