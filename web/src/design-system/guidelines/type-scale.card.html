<!-- @dsCard group="Type" viewport="700x230" name="Type scale — Manrope" subtitle="One family carries the UI; weight & size make hierarchy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-primary); }
  .wrap { padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .spec { flex: 0 0 84px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
  .sample { line-height: var(--lh-tight); letter-spacing: var(--ls-tight); }
  .display { font-size: var(--fs-display); font-weight: var(--fw-extra); }
  .title { font-size: var(--fs-title); font-weight: var(--fw-bold); }
  .heading { font-size: var(--fs-heading); font-weight: var(--fw-semibold); }
  .body { font-size: var(--fs-body); font-weight: var(--fw-medium); letter-spacing: 0; color: var(--text-secondary); }
  .small { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-tertiary); letter-spacing: 0; }
  .eyebrow { font-size: var(--fs-xs); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="spec">28 · 800</span><span class="sample display">You're almost there.</span></div>
    <div class="line"><span class="spec">20 · 700</span><span class="sample title">Connect your Meta Pixel</span></div>
    <div class="line"><span class="spec">17 · 600</span><span class="sample heading">Step 3 — copy your ID</span></div>
    <div class="line"><span class="spec">15 · 500</span><span class="sample body">Click the Events Manager tab on the left.</span></div>
    <div class="line"><span class="spec">13 · 500</span><span class="sample small">Take your time — I'll be right here.</span></div>
    <div class="line"><span class="spec">11.5 · 700</span><span class="sample eyebrow">Step 3 of 6</span></div>
  </div>
</body>
</html>
